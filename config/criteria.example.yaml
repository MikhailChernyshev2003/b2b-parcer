# Пример критериев отбора тендеров.
# Скопируйте в config/criteria.yaml и отредактируйте под вашу компанию.
# Все секции необязательны. Пустой файл = совпадает всё со score 0.

# Совпадение, если в тексте процедуры есть ХОТЯ БЫ ОДНО из слов (логика ИЛИ).
# Эти же слова по умолчанию используются как поисковые запросы при `scrape`.
keywordsAny:
  - насосы
  - электродвигатели
  - трубы

# Обязательные слова: должны присутствовать ВСЕ (логика И). Обычно пусто.
keywordsAll: []

# Стоп-слова: если встречается любое — тендер отбраковывается.
exclude:
  - демонтаж
  - металлолом
  - аренда

# Ограничение по категориям (подстрока, ИЛИ). Пусто = любая категория.
categoriesAny: []

# Ограничение по регионам (подстрока, ИЛИ). Пусто = любой регион.
regionsAny: []

# Только эти типы процедур (подстрока, ИЛИ). Пусто = любой тип.
# Примеры: "Запрос предложений", "Аукцион", "Конкурс", "Объявление о продаже"
procedureTypesAny: []

# Исключить организаторов (подстрока по названию).
organizersExclude: []

# Коды ОКПД2 / ОКВЭД (префиксы). Совпадение, если код тендера начинается с
# одного из указанных. Например, "28.13" совпадёт с "28.13.14.110".
# Пусто = не учитывается.
classifierCodes: []

# --- Анализ содержимого документации (требует авторизации для скачивания файлов) ---
# Совпадение, если в тексте документов есть ХОТЯ БЫ ОДНО слово.
docKeywordsAny: []
# Должны присутствовать ВСЕ слова в документации.
docKeywordsAll: []
# Отбраковать, если в документации встречается любое из слов.
docExclude: []

# Ценовые границы в рублях (берутся из карточки, если цена указана).
# priceMin: 100000
# priceMax: 50000000

# Требовать минимум N дней до окончания подачи заявок (чтобы успеть подготовиться).
minDaysUntilEnd: 2

# Веса для подсчёта итогового score.
weights:
  keywordAny: 2
  keywordAll: 3
  category: 2
  region: 1
  procedureType: 1
  priceInRange: 1
  classifierCode: 3
  docKeywordAny: 2
  docKeywordAll: 3

# Минимальный score, чтобы тендер попал в отчёт.
minScore: 2
