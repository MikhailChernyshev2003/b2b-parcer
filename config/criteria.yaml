# Критерии отбора тендеров.
# Сформированы автоматически на основе анализа 41 архивного тендера,
# в которых компания участвовала (b2b-center.ru, «Торги с моим участием»).
#
# Поиск слов морфологический: «разработка сайта» найдёт «разработке сайтов»,
# «цифровой продукт» найдёт «цифровые продукты». Фразы ищутся как соседние
# слова. Пишите слова в начальной форме.
#
# Без авторизации эти же слова используются как поисковые запросы при сборе
# (с авторизацией собирается вся лента), поэтому используйте полные слова,
# а не обрезанные корни.

keywordsAny:
  # Программное обеспечение и ИС
  # («программное обеспечение» убрано: оно входит в название категории
  #  «ПО (программное обеспечение)» и давало баллы любой закупке лицензий)
  - информационная система
  - техническая поддержка
  - сопровождение информационных систем
  # Платформы и технологии
  - 1С
  - СУБД
  - PostgreSQL
  - BI
  - DWH
  - ETL
  - DevOps
  - хранилище данных
  - аналитика данных
  # ИИ и боты
  - чат-бот
  - бот
  - искусственный интеллект
  - машинное обучение
  - нейросеть
  - ИИ
  - чат-платформа
  - голосовой ассистент
  - прогнозирование
  # Веб и мобильная разработка
  - разработка сайта
  - веб-разработка
  - мобильное приложение
  - личный кабинет
  - лендинг
  - брендбук
  # Корпоративные системы
  - CRM
  - ERP
  - документооборот
  - программа лояльности
  # Процессы
  - автоматизация процессов
  - цифровизация
  - автотесты
  - тест-кейс
  - интеграция
  - информационные услуги
  - веб-сервис
  - приложение
  - внедрение
  - сервис
  # Маркетинг и digital
  - SMM
  - социальные сети
  - продвижение
  - репутация
  - репутационный аудит
  - маркетинг
  - digital
  - контент
  # Исследования и аудиты, смежные с ИТ (общее слово «аудит» не добавлено,
  # чтобы не цеплять финансовый аудит, энергоаудит и т. п.)
  - UX
  - CX
  - CJM
  - NPS
  - юзабилити
  - UX-аудит
  - аудит сайта
  - аудит приложения
  - аудит программы лояльности
  - клиентский опыт
  - пользовательский опыт
  - пользовательское исследование
  - исследование аудитории
  - customer journey

# Обязательные слова: должны присутствовать ВСЕ (логика И). Обычно пусто.
keywordsAll: []

# Стоп-слова: если встречается любое — тендер отбраковывается.
# Отсекают закупки «железа» и поставки товаров, к которым цепляются IT-слова.
exclude:
  - поставка лицензий
  - поставка оборудования
  - поставка ключей активации
  - источник бесперебойного питания
  - комплектующие

# Ограничение по категориям (ИЛИ). Пусто = любая категория.
# Отсекает тендер, только если категория ИЗВЕСТНА и не совпала; тендеры без
# категории (ещё без карточки) проходят дальше. В архиве ваших участий все
# карточки шли с категорией «ПО (программное обеспечение)».
categoriesAny:
  - ПО (программное обеспечение)
  - программное обеспечение
  - информационные технологии
  - ИТ-услуги
  - разработка
  - Рекламные услуги
  - маркетинг
  # «Услуги (аудит, консалтинг, юридические, переводы)» — сюда попадают и
  # аудиты, смежные с ИТ; отделяют их ключевые слова выше.
  - консалтинг

# Ограничение по регионам (ИЛИ). Пусто = любой регион.
# Оставлено пустым: в архиве заказчики со всей России (IT-работы удалённые).
regionsAny: []

# Только эти типы процедур (ИЛИ). Пусто = любой тип.
# Оставлено пустым намеренно: в архиве встречались «Запрос предложений»,
# «Запрос цен», «Многолотовый ПКО», и жёсткий фильтр отрезал бы новые типы.
procedureTypesAny: []

# Исключить организаторов (подстрока по названию).
organizersExclude: []

# Коды ОКПД2 / ОКВЭД (префиксы). В архивных тендерах карточки шли с категорией
# «ПО (программное обеспечение)» без кодов ОКПД2, поэтому оставлено пустым.
# Для справки, IT-коды: 62.01 (разработка ПО), 62.02 (консультации),
# 62.03 (управление ИС), 62.09, 63.11 (обработка данных).
classifierCodes: []

# --- Анализ содержимого документации (требует авторизации) ---
# docKeywordsAny — бонусные баллы за профильные термины в тексте документов.
# Не отбраковывает тендеры без документации, только повышает score тем,
# где документация подтверждает профиль (термины из ТЗ ваших архивных тендеров).
docKeywordsAny:
  - техническое задание
  - разработка
  - интеграция
  - API
  - SLA
  - техническая поддержка
  - сопровождение
  - тестирование
  - 1С
  - СУБД
  - базы данных
  - интерфейс
  - личный кабинет
  - мобильное приложение
  - аналитика

# Обязательные слова в документации (жёсткий фильтр: без проанализированной
# документации тендер будет отложен как «не проанализирован»). Оставлено пусто.
docKeywordsAll: []

# Стоп-слова в документации (жёсткий фильтр). Примеры под вашу специфику:
# лицензия ФСБ — если нет допуска к гостайне; выезд на объект — если работаете
# только удалённо. Раскомментируйте нужное.
docExclude: []
#  - лицензия ФСБ
#  - допуск к государственной тайне

# Ценовые границы в рублях.
# priceMin: 100000
# priceMax: 50000000

# Минимум N дней до окончания подачи заявок.
minDaysUntilEnd: 2

# Веса для подсчёта итогового score.
weights:
  keywordAny: 2
  keywordAll: 3
  category: 2
  region: 1
  procedureType: 1
  priceInRange: 1
  classifierCode: 3
  docKeywordAny: 2
  docKeywordAll: 3

# Минимальный score, чтобы тендер считался подходящим.
minScore: 2
